api:
  insecure: false
  dashboard: false

entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint: { to: websecure, scheme: https }
  websecure:
    address: ':443'
    http:
      tls: { }
providers:
  docker:
    network: web
    defaultRule: "Host(`{{ index .Labels \"com.docker.compose.service\" }}.vivien-goncalves.fr`)"
    exposedByDefault: false
  file:
    filename: /etc/traefik/dynamic_conf.yml
