api:
  insecure: true
entryPoints:
  web:
    address: ":80"
  websecure:
    address: ':443'
    http:
      tls: { }
providers:
  docker:
    network: web
    defaultRule: "Host(`{{ index .Labels \"com.docker.compose.service\" }}.vivien-goncalves.fr`)"
    exposedByDefault: false
  file:
    filename: /etc/traefik/dynamic_conf.yml
